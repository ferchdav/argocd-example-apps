apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-appset
  namespace: argocd
spec:
  generators:
  - list:
      elements:

      - name: app-appONE
        namespace: appA
        path: app-A

      - name: app-appTWO
        namespace: appB
        path: app-A

      - name: app-appTHREE
        namespace: appC
        path: app-B

      - name: app-appFOUR
        namespace: appD
        path: app-C
        # path: helm-app

  template:
    metadata:
      name: '{{name}}'
    spec:
      project: project-2
      source:
        repoURL: https://github.com/ferchdav/argocd-example-apps.git
        targetRevision: master
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      # syncPolicy:
      #   automated:
      #     selfHeal: true
      #     prune: true
      #   syncOptions:
      #     - CreateNamespace=true
      #     - PruneLast=true
