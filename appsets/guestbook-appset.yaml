apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-appset
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: guestbook-app1
        namespace: app1
        path: guestbook
      - name: guestbook-app2
        namespace: app2
        path: guestbook
      - name: guestbook-app3
        namespace: app3
        path: guestbook
      - name: guestbook-app4
        namespace: app4
        path: helm-guestbook
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
