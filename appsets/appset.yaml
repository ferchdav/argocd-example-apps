apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-appset
spec:
  generators:
    - list:
        elements:
          - app: guestbook-4
            appns: app4
          - app: guestbook-5
            appns: app5
  template:
    metadata:
      name: '{{app}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/ferchdav/argocd-example-apps
        path: 'guestbook'
        targetRevision: master
      destination:
        name: in-cluster
        namespace: '{{appns}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true