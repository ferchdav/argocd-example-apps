apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-appset
  namespace: argocd
spec:
  generators:
  - list:
      elements:

      - name: app-app1
        namespace: app1
        path: app-A

      - name: app-app2
        namespace: app2
        path: app-A

      - name: app-app3
        namespace: app3
        path: app-B

      - name: app-app4
        namespace: app4
        path: app-C
        # path: helm-app

  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/ferchdav/argocd-example-apps.git
        targetRevision: master
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      # syncPolicy:
      #   automated:
      #     selfHeal: true
      #     prune: true
      #   syncOptions:
      #     - CreateNamespace=true
      #     - PruneLast=true
