apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app-ui
  template:
    metadata:
      labels:
        app: app-ui
    spec:
      containers:
      - image: gcr.io/heptio-images/ks-app-demo:0.2
        # image: nginx:stable-alpine
        name: app-ui
        ports:
        - containerPort: 80
