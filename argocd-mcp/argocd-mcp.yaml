apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      containers:
        - name: argocd-mcp
          image: node:22-alpine

          command:
            - sh
            - -c

          # args:
          #   - |
          #     npm install -g argocd-mcp@latest && \
          #     argocd-mcp sse --port 3000

          args:
            - |
              set -x
              npm install -g argocd-mcp@latest
              which argocd-mcp
              argocd-mcp http --port 3000

          env:
            - name: ARGOCD_BASE_URL
              value: "https://argocd-server.argocd.svc.cluster.local:443"

            - name: ARGOCD_SERVER
              value: "argocd-server.argocd.svc.cluster.local:443"

            - name: ARGOCD_INSECURE
              value: "true"

            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"

            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-mcp-secret
                  key: ARGOCD_API_TOKEN

            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"

            - name: PORT
              value: "3000"

          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-mcp
  namespace: mcp
spec:
  selector:
    app: argocd-mcp

  ports:
    - port: 3000
      targetPort: 3000

  type: ClusterIP
